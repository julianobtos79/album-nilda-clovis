<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aniversário 76 Anos - Nilda & Clóvis</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fcf8f2;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      justify-content: space-between;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      margin-top: 20px;
    }
    h1 {
      text-align: center;
      color: #bfa15f;
      margin-bottom: 5px;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }
    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      height: 100px;
    }
    button, .btn-galeria {
      background-color: #bfa15f;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
      text-decoration: none;
      display: block;
      box-sizing: border-box;
    }
    button:hover, .btn-galeria:hover {
      background-color: #a68b4f;
    }
    .btn-galeria {
      background-color: #6c757d;
      margin-top: 15px;
    }
    .btn-galeria:hover {
      background-color: #5a6268;
    }
    /* Estilo para o link discreto de administração */
    .admin-footer {
      text-align: center;
      margin-top: 20px;
      padding-bottom: 10px;
    }
    .admin-footer a {
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .admin-footer a:hover {
      color: #666;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>76 Anos Nilda & Clóvis</h1>
    <p class="subtitle">Partilhe connosco um momento especial da festa!</p>

    <form id="formFoto" onsubmit="enviarFoto(event)">
      <div class="form-group">
        <label for="nomeInput">O seu Nome:</label>
        <input type="text" id="nomeInput" required placeholder="Ex: Maria Silva">
      </div>

      <div class="form-group">
        <label for="relacaoInput">Qual a sua relação com os homenageados?</label>
        <select id="relacaoInput" required>
          <option value="">Selecione...</option>
          <option value="Familiar">Familiar</option>
          <option value="Amigo(a)">Amigo(a)</option>
          <option value="Convidado(a)">Convidado(a)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mensagemInput">Mensagem de parabéns:</label>
        <textarea id="mensagemInput" placeholder="Deixe uma mensagem carinhosa..."></textarea>
      </div>

      <div class="form-group">
        <label for="fotoInput">Selecione a Fotografia:</label>
        <input type="file" id="fotoInput" accept="image/*" required>
      </div>

      <button type="submit" id="btnEnviar">Enviar Fotografia</button>
    </form>

    <a href="galeria.html" class="btn-galeria">Ver Álbum da Festa</a>
  </div>

  <!-- Acesso discreto para o painel de administração -->
  <div class="admin-footer">
    <a href="admin.html">⚙️ Painel de Administração</a>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://gfoawsiqxnkszlgmtmrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Zq0QtvSeiXAZsOCIOptNw_rdeqzR8w';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function enviarFoto(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btnEnviar');
      btn.innerText = "A enviar...";
      btn.disabled = true;

      const arquivoInput = document.getElementById('fotoInput').files[0];
      const nomeAutor = document.getElementById('nomeInput').value;
      const relacao = document.getElementById('relacaoInput').value;
      const mensagem = document.getElementById('mensagemInput').value;

      if (!arquivoInput) {
        alert("Por favor, selecione uma foto!");
        btn.innerText = "Enviar Fotografia";
        btn.disabled = false;
        return;
      }

      const nomeArquivo = `${Date.now()}_${arquivoInput.name}`;
      const { error: uploadError } = await supabase.storage
        .from('imagens-festa')
        .upload(nomeArquivo, arquivoInput);

      if (uploadError) {
        alert("Erro ao enviar a imagem: " + uploadError.message);
        btn.innerText = "Enviar Fotografia";
        btn.disabled = false;
        return;
      }

      const { data: urlData } = supabase.storage
        .from('imagens-festa')
        .getPublicUrl(nomeArquivo);

      const urlImagem = urlData.publicUrl;

      const { error: dbError } = await supabase
        .from('fotos')
        .insert([
          { nome_autor: nomeAutor, relacao: relacao, url_imagem: urlImagem, mensagem: mensagem, status: 'PENDENTE' }
        ]);

      if (dbError) {
        alert("Erro ao salvar os dados: " + dbError.message);
      } else {
        alert("Foto enviada com sucesso! Aguardando moderação.");
        document.getElementById('formFoto').reset();
      }

      btn.innerText = "Enviar Fotografia";
      btn.disabled = false;
    }

    window.enviarFoto = enviarFoto;
  </script>

</body>
</html>
