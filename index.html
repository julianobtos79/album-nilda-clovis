<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://gfoawsiqxnkszlgmtmrl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_7Zq0QtvSeiXAZsOCIOptNw_rdeqzR8w';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function enviarFoto(event) {
    event.preventDefault();
    
    const arquivoInput = document.getElementById('fotoInput').files[0];
    const nomeAutor = document.getElementById('nomeInput').value;
    const relacao = document.getElementById('relacaoInput').value;
    const mensagem = document.getElementById('mensagemInput').value;

    if (!arquivoInput) {
      alert("Por favor, selecione uma foto da galeria!");
      return;
    }

    // 1. Enviar a imagem para o Storage (bucket: imagens-festa)
    const nomeArquivo = `${Date.now()}_${arquivoInput.name}`;
    const { data: uploadData, error: uploadError } = await supabase.storage
      .from('imagens-festa')
      .upload(nomeArquivo, arquivoInput);

    if (uploadError) {
      alert("Erro ao enviar a imagem: " + uploadError.message);
      return;
    }

    // 2. Obter a URL pública da imagem enviada
    const { data: urlData } = supabase.storage
      .from('imagens-festa')
      .getPublicUrl(nomeArquivo);

    const urlImagem = urlData.publicUrl;

    // 3. Salvar os dados na tabela 'fotos' com status PENDENTE
    const { error: dbError } = await supabase
      .from('fotos')
      .insert([
        { nome_autor: nomeAutor, relacao: relacao, url_imagem: urlImagem, mensagem: mensagem, status: 'PENDENTE' }
      ]);

    if (dbError) {
      alert("Erro ao salvar os dados: " + dbError.message);
    } else {
      alert("Foto enviada com sucesso! Aguardando moderação.");
      document.getElementById('formFoto').reset();
    }
  }

  window.enviarFoto = enviarFoto;
</script>
