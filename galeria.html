<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://gfoawsiqxnkszlgmtmrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Zq0QtvSeiXAZsOCIOptNw_rdeqzR8w';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function iniciarGaleria() {
      const container = document.getElementById('galeriaContainer');

      try {
        // Consulta corrigida sem o campo criado_em que causava o erro
        const { data: fotos, error } = await supabase
          .from('fotos')
          .select('*');

        if (error) {
          container.innerHTML = `<div class="mensagem-aviso">Erro na base de dados:<br>${error.message}</div>`;
          return;
        }

        if (!fotos || fotos.length === 0) {
          container.innerHTML = `<div class="mensagem-aviso">Ainda não existem fotografias registadas.</div>`;
          return;
        }

        container.innerHTML = '';

        fotos.forEach(foto => {
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          
          slide.innerHTML = `
            <img src="${foto.url_imagem}" alt="Foto">
            <div class="foto-overlay">
              <h3>${foto.nome_autor || 'Convidado'} <span style="font-size: 11px; color: #bfa15f;">(${foto.relacao || ''})</span></h3>
              ${foto.mensagem ? `<p>"${foto.mensagem}"</p>` : ''}
            </div>
          `;
          
          container.appendChild(slide);
        });

      } catch (err) {
        container.innerHTML = `<div class="mensagem-aviso">Erro inesperado ao carregar:<br>${err.message}</div>`;
      }
    }

    iniciarGaleria();
  </script>
