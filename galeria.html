<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria da Festa - 76 Anos Nilda & Clóvis</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-voltar {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      backdrop-filter: blur(5px);
    }

    .titulo-topo {
      font-size: 14px;
      color: #bfa15f;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .carousel-container {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-sizing: border-box;
      padding: 70px 20px 40px 20px;
    }

    .carousel-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .foto-overlay {
      position: absolute;
      bottom: 30px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 15px;
      border-radius: 8px;
      border-left: 4px solid #bfa15f;
      max-width: 400px;
      margin: 0 auto;
    }

    .foto-overlay h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
    }

    .foto-overlay p {
      margin: 0;
      font-size: 12px;
      color: #ccc;
    }

    .mensagem-aviso {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      color: #ff6b6b;
      padding: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-voltar">← Enviar Foto</a>
    <div class="titulo-topo">Álbum 76 Anos</div>
  </div>

  <div id="galeriaContainer" class="carousel-container">
    <div class="mensagem-aviso" style="color: #aaa;">A inicializar sistema...</div>
  </div>

  <script>
    // Captura qualquer erro global no ecran para nunca mais ficar em branco
    window.onerror = function(msg, url, line) {
      const container = document.getElementById('galeriaContainer');
      if (container) {
        container.innerHTML = `<div class="mensagem-aviso"><strong>Erro detetado:</strong><br>${msg}<br><small>Linha: ${line}</small></div>`;
      }
      return true;
    };
  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://gfoawsiqxnkszlgmtmrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Zq0QtvSeiXAZsOCIOptNw_rdeqzR8w';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function iniciarGaleria() {
      const container = document.getElementById('galeriaContainer');

      const { data: fotos, error } = await supabase
        .from('fotos')
        .select('*');

      if (error) {
        container.innerHTML = `<div class="mensagem-aviso">Erro na base de dados:<br>${error.message}</div>`;
        return;
      }

      if (!fotos || fotos.length === 0) {
        container.innerHTML = `<div class="mensagem-aviso" style="color: #aaa;">Ainda não existem fotografias registadas na base de dados.</div>`;
        return;
      }

      container.innerHTML = '';

      fotos.forEach(foto => {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        
        slide.innerHTML = `
          <img src="${foto.url_imagem}" alt="Foto">
          <div class="foto-overlay">
            <h3>${foto.nome_autor || 'Convidado'} <span style="font-size: 11px; color: #bfa15f;">(${foto.relacao || ''})</span></h3>
            ${foto.mensagem ? `<p>"${foto.mensagem}"</p>` : ''}
          </div>
        `;
        
        container.appendChild(slide);
      });
    }

    iniciarGaleria();
  </script>

</body>
</html>
