<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://gfoawsiqxnkszlgmtmrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Zq0QtvSeiXAZsOCIOptNw_rdeqzR8w';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarGaleriaCarrossel() {
      const container = document.getElementById('galeriaContainer');

      // Busca todas as fotos sem filtrar o status primeiro para sabermos o que existe
      const { data: fotos, error } = await supabase
        .from('fotos')
        .select('*')
        .order('criado_em', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="sem-fotos"><h2>Erro ao conectar à base de dados.</h2><p>${error.message}</p></div>`;
        return;
      }

      if (!fotos || fotos.length === 0) {
        container.innerHTML = '<div class="sem-fotos"><h2>A tabela está vazia.</h2><p>Nenhum registo encontrado na base de dados.</p></div>';
        return;
      }

      // Filtra de forma flexível (aceita 'APROVADO', 'aprovado', etc., ou se o campo estiver vazio)
      const fotosAprovadas = fotos.filter(f => {
        if (!f.status) return true; // Se o campo status não estiver a ser usado, mostra tudo
        const status = f.status.toUpperCase();
        return status === 'APROVADO' || status === 'APROVADA';
      });

      if (fotosAprovadas.length === 0) {
        container.innerHTML = `
          <div class="sem-fotos" style="text-align: left; max-width: 400px;">
            <h2>Existem fotos, mas nenhuma está aprovada!</h2>
            <p>Total de fotos na base: ${fotos.length}</p>
            <p>Vá ao <a href="admin.html" style="color: #bfa15f;">Painel de Administração</a> para aprovar as fotografias.</p>
          </div>`;
        return;
      }

      container.innerHTML = '';

      // Renderiza as fotos aprovadas no carrossel
      fotosAprovadas.forEach(foto => {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        
        slide.innerHTML = `
          <img src="${foto.url_imagem}" alt="Foto de ${foto.nome_autor || 'Convidado'}">
          <div class="foto-overlay">
            <h3>${foto.nome_autor || 'Convidado'} <span style="font-weight: normal; font-size: 12px; color: #bfa15f;">(${foto.relacao || 'Festa'})</span></h3>
            ${foto.mensagem ? `<p>"${foto.mensagem}"</p>` : ''}
          </div>
        `;
        
        container.appendChild(slide);
      });
    }

    carregarGaleriaCarrossel();
  </script>
