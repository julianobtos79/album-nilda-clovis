<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria da Festa - 76 Anos Nilda & Clóvis</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-voltar {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      backdrop-filter: blur(5px);
    }

    .titulo-topo {
      font-size: 14px;
      color: #bfa15f;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .carousel-container {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-sizing: border-box;
      padding: 70px 20px 40px 20px;
    }

    .carousel-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .foto-overlay {
      position: absolute;
      bottom: 30px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #bfa15f;
      max-width: 400px;
      margin: 0 auto;
    }

    .foto-overlay h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
    }

    .foto-overlay p {
      margin: 0;
      font-size: 12px;
      color: #ccc;
    }

    .btn-emoji {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-emoji:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .mensagem-aviso {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      color: #aaa;
      padding: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-voltar">← Enviar Foto</a>
    <div class="titulo-topo">Álbum 76 Anos</div>
  </div>

  <div id="galeriaContainer" class="carousel-container">
    <div class="mensagem-aviso">A carregar galeria...</div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const container = document.getElementById('galeriaContainer');
      if (container) {
        container.innerHTML = `<div class="mensagem-aviso" style="color: #ff6b6b;"><strong>Erro detetado:</strong><br>${msg}<br><small>Linha: ${line}</small></div>`;
      }
      return true;
    };
  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://gfoawsiqxnkszlgmtmrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Zq0QtvSeiXAZsOCIOptNw_rdeqzR8w';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function iniciarGaleria() {
      const container = document.getElementById('galeriaContainer');

      try {
        // Busca apenas as fotografias cujo estado está aprovado (ignora maiúsculas/minúsculas)
        const { data: fotos, error } = await supabase
          .from('fotos')
          .select('*')
          .ilike('status', 'APROVADO');

        if (error) {
          container.innerHTML = `<div class="mensagem-aviso" style="color: #ff6b6b;">Erro na base de dados:<br>${error.message}</div>`;
          return;
        }

        if (!fotos || fotos.length === 0) {
          container.innerHTML = `<div class="mensagem-aviso">A aguardar a aprovação de novas fotografias no painel de administração.</div>`;
          return;
        }

        container.innerHTML = '';

        fotos.forEach(foto => {
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          
          const lCoracao = foto.likes_coracao || 0;
          const lPalmas = foto.likes_palmas || 0;
          const lFesta = foto.likes_festa || 0;
          
          slide.innerHTML = `
            <img src="${foto.url_imagem}" alt="Foto">
            <div class="foto-overlay">
              <h3>${foto.nome_autor || 'Convidado'} <span style="font-size: 11px; color: #bfa15f;">(${foto.relacao || ''})</span></h3>
              ${foto.mensagem ? `<p style="margin-bottom: 8px;">"${foto.mensagem}"</p>` : ''}
              
              <div style="display: flex; gap: 10px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px;">
                <button class="btn-emoji" onclick="darLike('${foto.id}', 'coracao', this)">
                  ❤️ <span id="count-coracao-${foto.id}">${lCoracao}</span>
                </button>
                <button class="btn-emoji" onclick="darLike('${foto.id}', 'palmas', this)">
                  👏 <span id="count-palmas-${foto.id}">${lPalmas}</span>
                </button>
                <button class="btn-emoji" onclick="darLike('${foto.id}', 'festa', this)">
                  🥳 <span id="count-festa-${foto.id}">${lFesta}</span>
                </button>
              </div>
            </div>
          `;
          
          container.appendChild(slide);
        });

      } catch (err) {
        container.innerHTML = `<div class="mensagem-aviso" style="color: #ff6b6b;">Erro inesperado:<br>${err.message}</div>`;
      }
    }

    window.darLike = async function(idFoto, tipo, btnElement) {
      btnElement.style.transform = 'scale(1.2)';
      setTimeout(() => btnElement.style.transform = 'scale(1)', 200);

      const spanCount = document.getElementById(`count-${tipo}-${idFoto}`);
      let atual = parseInt(spanCount.innerText) || 0;
      atual += 1;
      spanCount.innerText = atual;

      let coluna = 'likes_coracao';
      if (tipo === 'palmas') coluna = 'likes_palmas';
      if (tipo === 'festa') coluna = 'likes_festa';

      const { error } = await supabase
        .from('fotos')
        .update({ [coluna]: atual })
        .eq('id', idFoto);

      if (error) {
        console.error("Erro ao atualizar like:", error.message);
      }
    };

    iniciarGaleria();
  </script>

</body>
</html>
